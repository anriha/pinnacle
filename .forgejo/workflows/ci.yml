name: CI

# Everything runs inside the podman job container, never on the host: the job
# gets the repository checkout and a throwaway image, not nina's store, PATH or
# daemon. nix is installed into that image by the job itself, because the plain
# `nixos/nix` image has no node and cannot run `actions/checkout`, and because
# the flake is the only thing that knows about libdisplay-info 0.3 (Ubuntu 24.04
# ships 0.1.x, so an apt build cannot work).
#
# Cost of the isolation: no persistent store, so every run substitutes and
# compiles from scratch. If that gets annoying, the fix is a persistent volume
# for /nix owned by the CI only, not a move back to the host runner.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `just` and `cargo` want a writable runtime dir; a bare container has none.
  XDG_RUNTIME_DIR: ${{ github.workspace }}/.runtime

jobs:
  build-and-lint:
    runs-on: pinnacle-ci
    name: Build, test, clippy
    steps:
      - uses: actions/checkout@v4

      - name: Install nix
        # Fully qualified: a relative `owner/repo@ref` is prefixed with the
        # instance's DEFAULT_ACTIONS_URL (data.forgejo.org here), which does not
        # mirror this action.
        uses: https://github.com/cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false

      # The derivation runs the integration suite in checkPhase, so this is
      # build and test in one step.
      - name: Build and test
        run: nix build .#pinnacle --no-link --print-build-logs

      # `-A unused` covers a handful of dead-code warnings the HDR work left
      # behind; everything else, clippy lints included, still fails the job.
      - name: Clippy
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          nix develop -c cargo clippy --all -- -D warnings -A unused

  wlcs:
    runs-on: pinnacle-ci
    name: WLCS conformance
    steps:
      - uses: actions/checkout@v4

      - name: Install nix
        # Fully qualified: a relative `owner/repo@ref` is prefixed with the
        # instance's DEFAULT_ACTIONS_URL (data.forgejo.org here), which does not
        # mirror this action.
        uses: https://github.com/cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false

      # One job for all groups: `just wlcs` compiles the pinned wlcs revision
      # and the module once, and every later group reuses that build. The
      # filters are the upstream ones, unchanged.
      - name: Run the groups
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          filters=(
            "SelfTest*:FrameSubmission*:-FrameSubmission.when_client_endlessly_requests_frame_then_callbacks_are_throttled"
            "XdgOutputV1Test*"
            "WlOutputTest*"
            "WpViewporter*:-WpViewporterTest.when_destination_is_not_set_source_must_have_integer_size:WpViewporterTest.source_rectangle_out_of_buffer_bounds_raises_protocol_error:WpViewporterTest.assigning_a_viewport_to_a_surface_with_an_existing_viewport_is_an_error"
            "PointerConstraints.*:-PointerConstraints.when_surface_is_reselected_persistent_confined_pointer_gets_notifications:PointerConstraints.when_surface_is_unselected_confined_pointer_gets_unconfined_notification:PointerConstraints.when_surface_is_reselected_persistent_locked_pointer_gets_notifications:PointerConstraints.when_surface_is_unselected_locked_pointer_gets_unlocked_notification"
            "ForeignToplevelManagerTest.does_not_detect_toplevels_when_test_creates_none:ForeignToplevelManagerTest.detects_toplevel_from_same_client:ForeignToplevelManagerTest.detects_toplevel_from_different_client:ForeignToplevelManagerTest.detects_toplevel_created_after_manager:ForeignToplevelManagerTest.detects_multiple_toplevels_from_multiple_clients"
            "Anchors/LayerSurfaceErrorsTest.specifying_zero_size_without_corresponding_anchors_is_an_error*:Anchor/LayerSurfaceLayoutTest.is_positioned_correctly_when_explicit_size_does_not_match_buffer_size*:Anchor/LayerSurfaceLayoutTest.is_positioned_correctly_when_layout_changed*:Anchor/LayerSurfaceLayoutTest.is_positioned_correctly_after_multiple_changes*:Anchor/LayerSurfaceLayoutTest.surfaces_with_exclusive_zone_set_to_negative_one_do_not_respect_other_exclusive_zones*"
          )
          for filter in "${filters[@]}"; do
            echo "=== $filter"
            nix develop -c just wlcs --gtest_filter="$filter"
          done
